name: openbitfun-relay-v1.0.2
services:
  relay-v1:
    image: openbitfun-relay-v1.0.2:${RELAY_GIT_COMMIT:?Set the verified source commit}
    build:
      context: ../..
      dockerfile: src/apps/relay-server/Dockerfile
      args:
        RELAY_GIT_COMMIT: ${RELAY_GIT_COMMIT:?Set the verified source commit}
        CARGO_BUILD_JOBS: "4"
    container_name: openbitfun-relay-v1.0.2
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    cpus: 4
    mem_limit: 4g
    pids_limit: 256
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    tmpfs:
      # The encrypted payload owner admits 512 MiB, plus temporary-file overhead.
      - /tmp:size=640m,mode=1777
    environment:
      RELAY_PORT: "19702"
      RELAY_LISTEN_ADDR: 127.0.0.1:19702
      RELAY_STATIC_DIR: /app/static
      RELAY_DB_PATH: /app/data/relay.db
      RELAY_ROOM_WEB_DIR: /app/room-web
      RELAY_ASSET_STORE_MAX_BYTES: "1073741824"
      # Self-hosted public origins: fill from the host environment or a
      # relay-v1.env file. The two page base URLs must be set together on two
      # distinct HTTPS origins; while unset, published Pages answer 503 and the
      # relay serves same-origin clients only (empty CORS allowlist).
      RELAY_CORS_ALLOW_ORIGINS: ${RELAY_CORS_ALLOW_ORIGINS:-}
      RELAY_PAGE_PUBLIC_BASE_URL: ${RELAY_PAGE_PUBLIC_BASE_URL:-}
      RELAY_PAGE_AUTH_BASE_URL: ${RELAY_PAGE_AUTH_BASE_URL:-}
      # Local account sign-in: Aliyun SMS delivery + registration gate.
      # Code sign-in is disabled (503) until the SMS variables are all set;
      # fill them from the host environment or a relay-v1.env file.
      RELAY_SMS_ALIYUN_ACCESS_KEY_ID: ${RELAY_SMS_ALIYUN_ACCESS_KEY_ID:-}
      RELAY_SMS_ALIYUN_ACCESS_KEY_SECRET: ${RELAY_SMS_ALIYUN_ACCESS_KEY_SECRET:-}
      RELAY_SMS_ALIYUN_SIGN_NAME: ${RELAY_SMS_ALIYUN_SIGN_NAME:-}
      RELAY_SMS_ALIYUN_TEMPLATE_CODE: ${RELAY_SMS_ALIYUN_TEMPLATE_CODE:-}
      RELAY_SMS_CODE_SECRET: ${RELAY_SMS_CODE_SECRET:-}
      RELAY_LOCAL_REGISTRATION: ${RELAY_LOCAL_REGISTRATION:-open}
      RUST_LOG: info
    volumes:
      # Static is baked into the image (/app/static); the host-side staging
      # directory was retired because a mounted copy can drift from the
      # binary's protocol build.
      - ${RELAY_DATA_ROOT:-/srv/openbitfun-relay-v1.0.2}/data:/app/data
      - ${RELAY_DATA_ROOT:-/srv/openbitfun-relay-v1.0.2}/assets:/app/room-web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:19702/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
